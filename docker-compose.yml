x-lakehouse: &lakehouse
  build:
    context: .
    dockerfile: lakehouse/Dockerfile
    args:
      APP_UID: ${LOCAL_UID:?Set LOCAL_UID to your non-root uid (id -u)}
      APP_GID: ${LOCAL_GID:?Set LOCAL_GID to your group id (id -g)}
  working_dir: /app
  volumes:
    - .:/app

services:
  pipeline:
    <<: *lakehouse
    command: python -m lakehouse.run_all
    profiles:
      - tools

  dashboard:
    <<: *lakehouse
    command:
      - bash
      - -lc
      - python -m lakehouse.run_all && streamlit run lakehouse/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
