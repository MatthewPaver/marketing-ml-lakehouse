name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "**/requirements.txt"
      # Runs the full offline pipeline (which regenerates docs/generated/evidence.json)
      # and the test suite. The console is only deployed if both succeed.
      - name: Run pipeline and tests
        run: make test
      - name: Check console evidence exists
        run: test -s docs/generated/evidence.json && python -c "import json; d=json.load(open('docs/generated/evidence.json')); print(d['generated_at'], d['models']['bookings']['split']['test_rows'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
