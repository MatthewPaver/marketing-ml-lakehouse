<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Marketing ML Lakehouse architecture</title>
  <desc id="desc">Raw CSV data flows through DuckDB bronze, silver, and gold tables into XGBoost models, quality checks, and a Streamlit dashboard.</desc>
  <rect width="1200" height="360" fill="#fbfaf7"/>
  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif">
    <text x="54" y="58" font-size="28" font-weight="800" fill="#151515">Architecture at a glance</text>
    <text x="54" y="88" font-size="17" font-weight="650" fill="#57534e">Local marketing CSVs become checked model features and a dashboard.</text>
  </g>
  <g font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="800">
    <rect x="54" y="145" width="155" height="96" fill="#ffffff" stroke="#151515" stroke-width="2"/>
    <text x="82" y="187" font-size="20" fill="#151515">Raw CSVs</text>
    <text x="82" y="215" font-size="14" fill="#57534e">campaign data</text>
    <rect x="264" y="145" width="155" height="96" fill="#f4f0e9" stroke="#151515" stroke-width="2"/>
    <text x="296" y="187" font-size="20" fill="#151515">Bronze</text>
    <text x="296" y="215" font-size="14" fill="#57534e">DuckDB ingest</text>
    <rect x="474" y="145" width="155" height="96" fill="#f4f0e9" stroke="#151515" stroke-width="2"/>
    <text x="508" y="187" font-size="20" fill="#151515">Silver</text>
    <text x="508" y="215" font-size="14" fill="#57534e">clean tables</text>
    <rect x="684" y="145" width="155" height="96" fill="#f4f0e9" stroke="#151515" stroke-width="2"/>
    <text x="718" y="187" font-size="20" fill="#151515">Gold</text>
    <text x="718" y="215" font-size="14" fill="#57534e">features</text>
    <rect x="894" y="112" width="230" height="62" fill="#151515"/>
    <text x="927" y="150" font-size="20" fill="#ffffff">XGBoost models</text>
    <rect x="894" y="212" width="230" height="62" fill="#0f766e"/>
    <text x="923" y="250" font-size="20" fill="#ffffff">Streamlit review</text>
  </g>
  <g stroke="#0f766e" stroke-width="4" fill="none">
    <path d="M209 193h55"/>
    <path d="M419 193h55"/>
    <path d="M629 193h55"/>
    <path d="M839 193c30 0 30-50 55-50"/>
    <path d="M839 193c30 0 30 50 55 50"/>
  </g>
</svg>
